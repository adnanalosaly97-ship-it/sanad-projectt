<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سند (SANAD)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background-color: #1a252f;
            background-image: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
            border: 8px solid #2c3e50;
        }

        .screen-content {
            padding: 25px 20px;
            background: #ffffff;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-section {
            text-align: center;
            margin-top: 5px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            background: #e8f8f5;
            color: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 8px auto;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }

        .logo-section h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 800;
        }

        .logo-section p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 2px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .custom-alert {
            background-color: #fdf2f2;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 700;
            border: 1px solid #f5b7b1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: right;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2d3748;
            font-weight: 600;
        }

        .input-box input:focus {
            border-color: #2980b9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.1);
        }

        .input-box span {
            position: absolute;
            left: 15px;
            font-size: 18px;
            color: #718096;
        }

        .btn-fingerprint {
            width: 100%;
            padding: 14px;
            background-color: #f0f7ff;
            color: #2980b9;
            border: 2px solid #bce0fd;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(41, 128, 185, 0.1);
        }

        .btn-fingerprint:hover {
            background-color: #d4eafc;
        }

        .btn-help {
            width: 100%;
            padding: 12px;
            background-color: #f8fafc;
            color: #4a5568;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-help:hover {
            background-color: #edf2f7;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .btn-primary:hover {
            background-color: #219653;
        }

        .footer-links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #718096;
            font-weight: 600;
        }

        .footer-links a {
            color: #2980b9;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="screen-content">
            
            <div class="header-section">
                <div class="logo-icon">🤝</div>
                <div class="logo-section">
                    <h1>سَنَد</h1>
                    <p>مرحباً بك في نظام رعاية كبار السن</p>
                </div>
            </div>

            <!-- صندوق الإنذارات الذكي -->
            <div id="alertBox" class="custom-alert hidden">
                <span>⚠️</span>
                <span id="alertText">الرجاء إدخال البيانات المطلوبة</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <div class="input-box">
                        <input type="text" id="identifier" placeholder="أدخل البريد الإلكتروني أو رقم الهاتف">
                        <span>📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <input type="password" id="password" placeholder="أدخل كلمة المرور">
                        <span>🔒</span>
                    </div>
                </div>

                <!-- زر البصمة الحقيقي الفعال عبر متصفحات الهواتف الحديثة -->
                <button type="button" class="btn-fingerprint" onclick="authenticateWithBiometrics()">
                    <span>👆</span> تسجيل الدخول السريع بالبصمة الحيوية
                </button>

                <!-- زر مساعدة في الدخول -->
                <button type="button" class="btn-help" onclick="showHelpModal()">
                    <span>❓</span> أتاج مساعدة في الدخول؟
                </button>

                <!-- زر تسجيل الدخول الأساسي -->
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
            </form>

            <!-- رابط الانتقال الصحيح لصفحة إنشاء الحساب -->
            <div class="footer-links">
                ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a>
            </div>

        </div>
    </div>

    <script>
        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alertBox');
            const alertText = document.getElementById('alertText');
            alertText.textContent = message;
            
            if (!isError) {
                alertBox.style.backgroundColor = '#e8f8f5';
                alertBox.style.color = '#27ae60';
                alertBox.style.borderColor = '#a3e4d7';
            } else {
                alertBox.style.backgroundColor = '#fdf2f2';
                alertBox.style.color = '#c0392b';
                alertBox.style.borderColor = '#f5b7b1';
            }

            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!identifier || !password) {
                showAlert('الرجاء إدخال البيانات المطلوبة للاستمرار');
                return;
            }

            showAlert('جاري التحقق من الحساب وتسجيل الدخول...', false);
            
            setTimeout(() => {
                showAlert('تم تسجيل الدخول بنجاح!', false);
            }, 1500);
        }

        // دالة تفعيل البصمة الحقيقية عبر Web Authentication API في الجوال
        async function authenticateWithBiometrics() {
            if (!window.PublicKeyCredential) {
                showAlert('متصفحك لا يدعم المصادقة الحيوية بالبصمة');
                return;
            }

            try {
                showAlert('يرجى تأكيد بصمة الإصبع في هاتفك...', false);

                // إعدادات طلب البصمة الحقيقية للجهاز
                const publicKeyCredentialRequestOptions = {
                    challenge: Uint8Array.from("sanad_secure_challenge_string", c => c.charCodeAt(0)),
                    timeout: 60000,
                    userVerification: "required"
                };

                // استدعاء نظام البصمة الخاص بالجهاز (مستشعر البصمة أو الوجه)
                const credential = await navigator.credentials.get({
                    publicKey: publicKeyCredentialRequestOptions
                });

                if (credential) {
                    showAlert('تم التعرف على البصمة وتسجيل الدخول بنجاح!', false);
                    setTimeout(() => {
                        // الانتقال لداشبورد كبار السن لاحقاً
                    }, 1500);
                }
            } catch (error) {
                console.error(error);
                showAlert('فشل التحقق من البصمة أو تم إلغاء العملية');
            }
        }

        function showHelpModal() {
            showAlert('تم إرسال طلب المساعدة الفنية، سيتم الاتصال بك قريباً');
        }
    </script>
</body>
</html>
