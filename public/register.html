<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - سند (SANAD)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background-color: #1a252f;
            background-image: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-container {
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 10px solid #1a252f;
        }

        .screen-content {
            padding: 30px 25px;
            background: #ffffff;
            min-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-section {
            text-align: center;
            margin-top: 10px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: #e8f8f5;
            color: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }

        .logo-section h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-section p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .custom-alert {
            background-color: #fdf2f2;
            color: #c0392b;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 700;
            border: 1px solid #f5b7b1;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(192, 57, 43, 0.05);
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input, 
        .input-box select {
            width: 100%;
            padding: 15px 15px 15px 45px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2d3748;
            font-weight: 600;
        }

        .input-box input:focus, 
        .input-box select:focus {
            border-color: #27ae60;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        .input-box span {
            position: absolute;
            left: 15px;
            font-size: 18px;
            color: #718096;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #219653;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #718096;
            font-weight: 600;
        }

        .footer-links a {
            color: #2980b9;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="screen-content">
            
            <div class="header-section">
                <div class="logo-icon">✨</div>
                <div class="logo-section">
                    <h1>إنشاء حساب جديد</h1>
                    <p>سجل بياناتك للانضمام إلى منصة سند</p>
                </div>
            </div>

            <div id="alertBox" class="custom-alert hidden">
                <span>⚠️</span>
                <span id="alertText">الرجاء إدخال البيانات المطلوبة</span>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <div class="input-box">
                        <input type="text" id="fullName" placeholder="الاسم الكامل">
                        <span>👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <input type="text" id="phone" placeholder="رقم الهاتف">
                        <span>📱</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <input type="email" id="email" placeholder="البريد الإلكتروني">
                        <span>📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <input type="password" id="password" placeholder="كلمة المرور (8 أحرف على الأقل)">
                        <span>🔒</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <select id="userRole">
                            <option value="ELDERLY">كبير سن (مستفيد)</option>
                            <option value="HELPER">مساعد / مقدم رعاية</option>
                        </select>
                        <span>⚙️</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">إتمام التسجيل وحفظ البيانات</button>
            </form>

            <div class="footer-links">
                لديك حساب مسبقاً؟ <a href="index.html">تسجيل الدخول</a>
            </div>

        </div>
    </div>

    <script>
        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alertBox');
            const alertText = document.getElementById('alertText');
            alertText.textContent = message;
            
            if (!isError) {
                alertBox.style.backgroundColor = '#e8f8f5';
                alertBox.style.color = '#27ae60';
                alertBox.style.borderColor = '#a3e4d7';
            } else {
                alertBox.style.backgroundColor = '#fdf2f2';
                alertBox.style.color = '#c0392b';
                alertBox.style.borderColor = '#f5b7b1';
            }

            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const full_name = document.getElementById('fullName').value.trim();
            const phone_number = document.getElementById('phone').value.trim();
            const email_address = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const user_role = document.getElementById('userRole').value;

            if (!full_name || (!phone_number && !email_address) || !password) {
                showAlert('الرجاء إدخال الاسم، وسائل الاتصال، وكلمة المرور بدقة');
                return;
            }

            if (password.length < 8) {
                showAlert('كلمة المرور يجب أن تكون 8 أحرف على الأقل للأمان');
                return;
            }

            try {
                showAlert('جاري إرسال البيانات وحفظها في قاعدة البيانات...', false);

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name,
                        phone_number,
                        email_address,
                        password,
                        user_role
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'SUCCESS') {
                    showAlert('تم إنشاء الحساب بنجاح! جاري تحويلك لتسجيل الدخول...', false);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'فشل عملية التسجيل، يرجى المحاولة مرة أخرى');
                }
            } catch (error) {
                console.error('Registration Error:', error);
                showAlert('حدث خطأ في الاتصال بالخادم الرئيسي (Server Connection Error)');
            }
        }
    </script>
</body>
</html>
