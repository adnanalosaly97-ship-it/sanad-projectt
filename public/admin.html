<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - سند (SANAD)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a252f;
            background-image: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background: #f8fafc;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 10px solid #1a252f;
        }

        .screen-header {
            background: #8e44ad;
            color: white;
            padding: 20px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-status {
            font-size: 13px;
            background: rgba(255,255,255,0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .screen-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 720px;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .stat-card .num {
            font-size: 24px;
            font-weight: 900;
            color: #8e44ad;
        }

        .stat-card .label {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 700;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            background: #f3e5f5;
            color: #8e44ad;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
        }

        .user-details {
            min-width: 0;
        }

        .user-details h5 {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .user-details span {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: 600;
        }

        .role-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 800;
            white-space: nowrap;
        }

        .role-elderly {
            background: #e8f8f5;
            color: #27ae60;
        }

        .role-helper {
            background: #ebf5fb;
            color: #2980b9;
        }

        .role-admin {
            background: #f3e5f5;
            color: #8e44ad;
        }

        .btn-action {
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: #4a5568;
            flex-shrink: 0;
        }

        .btn-action:hover {
            background: #edf2f7;
        }

        .system-logs {
            background: #ffffff;
            border-radius: 18px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            font-size: 12px;
            color: #4a5568;
            padding: 6px 0;
            border-bottom: 1px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .alert-modal {
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .alert-modal h2 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .alert-modal p {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .btn-close-modal {
            background: #8e44ad;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 360px) {
            .screen-content {
                padding: 12px;
            }

            .user-item {
                padding: 10px;
            }

            .role-badge {
                font-size: 10px;
                padding: 4px 5px;
            }

            .btn-action {
                padding: 5px 7px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="screen-header">
            <div class="header-title">
                <span>⚙️</span> لوحة الإدارة
            </div>
            <div class="header-status">
                👑 مدير النظام
            </div>
        </div>

        <div class="screen-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="num" id="totalUsers">—</div>
                    <div class="label">إجمالي المستخدمين</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="activeAlerts">—</div>
                    <div class="label">بلاغات نشطة</div>
                </div>
            </div>

            <div id="adminMessage"
                 role="status"
                 aria-live="polite"
                 style="display:none;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;color:#4a5568;font-size:12px;">
            </div>

            <div class="section-title">
                <span>إدارة المستخدمين</span>
                <button type="button" class="btn-action" onclick="addUserModal()">+ إضافة جديد</button>
            </div>

            <div class="user-list" id="adminUserList">
                <div class="user-item">
                    <div class="user-details">
                        <h5>جارٍ تحميل المستخدمين...</h5>
                        <span>يرجى الانتظار</span>
                    </div>
                </div>
            </div>

            <div class="section-title">
                <span>سجل أحداث النظام المباشر</span>
            </div>

            <div class="system-logs">
                <div class="log-item">
                    <span>سجل الأحداث</span>
                    <span style="color:#95a5a6;">غير مرتبط</span>
                </div>
                <div class="log-item">
                    <span>عرض السجلات الفعلية</span>
                    <span style="color:#95a5a6;">يتطلب مسار API</span>
                </div>
            </div>
        </div>
    </div>

    <div id="alertModal" class="custom-alert-overlay hidden">
        <div class="alert-modal">
            <div id="modalIcon" style="font-size:45px;margin-bottom:10px;">⚙️</div>
            <h2 id="modalTitle">إدارة النظام</h2>
            <p id="modalMessage">التفاصيل هنا</p>
            <button type="button" class="btn-close-modal" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        function showModal(title, message, icon = '⚙️') {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('alertModal').classList.add('hidden');
        }

        function showAdminMessage(message) {
            const element = document.getElementById('adminMessage');
            element.textContent = message;
            element.style.display = 'block';
        }

        async function adminRequest(path) {
            const token = localStorage.getItem('sanad_token');

            if (!token) {
                throw new Error('NO_TOKEN');
            }

            const response = await fetch(path, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/json'
                }
            });

            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                data = {};
            }

            if (response.status === 401) {
                throw new Error('UNAUTHORIZED');
            }

            if (response.status === 403) {
                throw new Error('FORBIDDEN');
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    data.error ||
                    'تعذر تنفيذ الطلب. رمز الخطأ: ' + response.status
                );
            }

            return data;
        }

        function getUserRole(user) {
            return String(
                user.user_role ||
                user.role ||
                ''
            ).toUpperCase();
        }

        function getRoleDetails(role) {
            if (role === 'ELDERLY') {
                return {
                    label: 'مستفيد',
                    description: 'كبير سن (مستفيد)',
                    avatar: '👴',
                    className: 'role-elderly'
                };
            }

            if (role === 'HELPER') {
                return {
                    label: 'مساعد',
                    description: 'مقدم رعاية',
                    avatar: '👨‍⚕️',
                    className: 'role-helper'
                };
            }

            if (role === 'ADMIN') {
                return {
                    label: 'مدير',
                    description: 'مدير النظام',
                    avatar: '👑',
                    className: 'role-admin'
                };
            }

            return {
                label: 'مستخدم',
                description: 'دور غير محدد',
                avatar: '👤',
                className: 'role-helper'
            };
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined) {
                element.textContent = text;
            }

            return element;
        }

        function renderUsers(users) {
            const list = document.getElementById('adminUserList');
            list.replaceChildren();

            if (!users.length) {
                const item = createElement('div', 'user-item');
                const details = createElement('div', 'user-details');
                details.appendChild(
                    createElement('h5', '', 'لا يوجد مستخدمون مسجلون')
                );
                details.appendChild(
                    createElement('span', '', 'ستظهر الحسابات هنا بعد تسجيلها')
                );
                item.appendChild(details);
                list.appendChild(item);
                return;
            }

            users.forEach(function(user) {
                const name = String(
                    user.full_name ||
                    user.name ||
                    'مستخدم بدون اسم'
                );

                const role = getRoleDetails(getUserRole(user));

                const item = createElement('div', 'user-item');
                const info = createElement('div', 'user-info');
                const avatar = createElement('div', 'user-avatar', role.avatar);
                const details = createElement('div', 'user-details');

                details.appendChild(createElement('h5', '', name));
                details.appendChild(
                    createElement('span', '', role.description)
                );

                info.appendChild(avatar);
                info.appendChild(details);

                const badge = createElement(
                    'span',
                    'role-badge ' + role.className,
                    role.label
                );

                const editButton = createElement(
                    'button',
                    'btn-action',
                    'تعديل'
                );

                editButton.type = 'button';
                editButton.addEventListener('click', function() {
                    editUser(name);
                });

                item.appendChild(info);
                item.appendChild(badge);
                item.appendChild(editButton);

                list.appendChild(item);
            });
        }

        function getFriendlyError(error) {
            if (error.message === 'NO_TOKEN') {
                return 'يرجى تسجيل الدخول أولًا بحساب المدير.';
            }

            if (error.message === 'UNAUTHORIZED') {
                return 'انتهت صلاحية تسجيل الدخول أو أن رمز الدخول غير صحيح. سجّل الدخول مجددًا.';
            }

            if (error.message === 'FORBIDDEN') {
                return 'هذا الحساب لا يملك صلاحية عرض المستخدمين. يلزم الدخول بحساب مدير.';
            }

            if (error instanceof TypeError) {
                return 'تعذر الاتصال بالخادم. تحقق من تشغيل الخادم واتصال الإنترنت.';
            }

            return error.message || 'حدث خطأ غير متوقع أثناء تحميل المستخدمين.';
        }

        async function fetchAdminUsers() {
            const list = document.getElementById('adminUserList');
            const total = document.getElementById('totalUsers');

            try {
                const data = await adminRequest('/api/auth/users');

                const users = Array.isArray(data)
                    ? data
                    : Array.isArray(data.users)
                        ? data.users
                        : Array.isArray(data.data)
                            ? data.data
                            : null;

                if (!users) {
                    throw new Error('استجابة الخادم لا تحتوي على قائمة مستخدمين معروفة.');
                }

                renderUsers(users);
                total.textContent = String(users.length);

                if (users.length === 0) {
                    showAdminMessage('تم الاتصال بالخادم، لكن لا توجد حسابات مسجلة حتى الآن.');
                } else {
                    showAdminMessage('تم تحميل المستخدمين من الخادم بنجاح.');
                }
            } catch (error) {
                total.textContent = '—';

                list.replaceChildren();

                const item = createElement('div', 'user-item');
                const details = createElement('div', 'user-details');

                details.appendChild(
                    createElement('h5', '', 'تعذر تحميل المستخدمين')
                );
                details.appendChild(
                    createElement('span', '', getFriendlyError(error))
                );

                item.appendChild(details);
                list.appendChild(item);

                showAdminMessage(getFriendlyError(error));
            }
        }

        function editUser(userName) {
            showModal(
                'تعديل حساب',
                'تم اختيار المستخدم: ' + userName +
                '. تعديل بيانات الحساب يحتاج إلى مسار تحديث في الخادم.',
                '✏️'
            );
        }

        function addUserModal() {
            showModal(
                'إضافة مستخدم جديد',
                'تسجيل الحسابات يتم حاليًا عبر واجهة التسجيل. الإضافة المباشرة من لوحة الإدارة تحتاج إلى مسار API مخصص.',
                '➕'
            );
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchAdminUsers();
        });
    </script>
</body>
</html>
