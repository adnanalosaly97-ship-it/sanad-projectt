<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سند (SANAD)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #1a252f;
            background-image: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-container {
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 10px solid #1a252f;
        }

        .screen-content {
            padding: 30px 25px;
            background: #ffffff;
            min-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-section {
            text-align: center;
            margin-top: 10px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: #e8f8f5;
            color: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }

        .logo-section h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-section p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .custom-alert {
            background-color: #fdf2f2;
            color: #c0392b;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 700;
            border: 1px solid #f5b7b1;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(192, 57, 43, 0.05);
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2d3748;
            font-weight: 600;
        }

        .input-box input:focus {
            border-color: #2980b9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.1);
        }

        .input-box span {
            position: absolute;
            left: 15px;
            font-size: 18px;
            color: #718096;
        }

        .btn-fingerprint {
            width: 100%;
            padding: 15px;
            background-color: #f0f7ff;
            color: #2980b9;
            border: 2px solid #bce0fd;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(41, 128, 185, 0.1);
        }

        .btn-fingerprint:hover {
            background-color: #d4eafc;
        }

        .btn-help {
            width: 100%;
            padding: 14px;
            background-color: #f8fafc;
            color: #4a5568;
            border: 2px dashed #cbd5e0;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .btn-help:hover {
            background-color: #edf2f7;
            border-color: #a0aec0;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .btn-primary:hover {
            background-color: #219653;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #718096;
            font-weight: 600;
        }

        .footer-links a {
            color: #2980b9;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="screen-content">

            <div class="header-section">
                <div class="logo-icon">🤝</div>
                <div class="logo-section">
                    <h1>سَنَد</h1>
                    <p>مرحباً بك في نظام رعاية كبار السن</p>
                </div>
            </div>

            <div id="alertBox" class="custom-alert hidden" role="status" aria-live="polite">
                <span>⚠️</span>
                <span id="alertText">الرجاء إدخال البيانات المطلوبة</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <div class="input-box">
                        <input
                            type="text"
                            id="identifier"
                            placeholder="البريد الإلكتروني أو رقم الهاتف"
                            autocomplete="username"
                            required
                        >
                        <span>📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="كلمة المرور"
                            autocomplete="current-password"
                            required
                        >
                        <span>🔒</span>
                    </div>
                </div>

                <button type="button" class="btn-fingerprint" onclick="authenticateWithBiometrics()">
                    <span>👆</span> تسجيل الدخول السريع بالبصمة الحيوية
                </button>

                <button type="button" class="btn-help" onclick="showHelpModal()">
                    <span>❓</span> أحتاج مساعدة في الدخول
                </button>

                <button type="submit" id="loginButton" class="btn-primary">
                    تسجيل الدخول
                </button>
            </form>

            <div class="footer-links">
                ليس لديك حساب؟
                <a href="register.html">أنشئ حساباً جديداً</a>
            </div>

        </div>
    </div>

    <script>
        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alertBox');
            const alertText = document.getElementById('alertText');

            alertText.textContent = message;

            if (!isError) {
                alertBox.style.backgroundColor = '#e8f8f5';
                alertBox.style.color = '#27ae60';
                alertBox.style.borderColor = '#a3e4d7';
            } else {
                alertBox.style.backgroundColor = '#fdf2f2';
                alertBox.style.color = '#c0392b';
                alertBox.style.borderColor = '#f5b7b1';
            }

            alertBox.classList.remove('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const loginButton = document.getElementById('loginButton');

            if (!identifier || !password) {
                showAlert('الرجاء إدخال البريد الإلكتروني أو الهاتف وكلمة المرور');
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = 'جارٍ التحقق...';

            try {
                showAlert('جاري الاتصال بالخادم والتحقق من الحساب...', false);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password
                    })
                });

                let data;

                try {
                    data = await response.json();
                } catch {
                    data = {};
                }

                if (response.ok && data.status === 'SUCCESS' && data.token) {
                    localStorage.setItem('sanad_token', data.token);

                    showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك...', false);

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    localStorage.removeItem('sanad_token');

                    showAlert(
                        data.message || 'تعذر تسجيل الدخول أو لم يُرجع الخادم رمز الجلسة.'
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = 'تسجيل الدخول';
                }
            } catch (error) {
                console.error('Login Error:', error);

                showAlert('حدث خطأ في الاتصال بالخادم. تحقق من تشغيل المشروع.');

                loginButton.disabled = false;
                loginButton.textContent = 'تسجيل الدخول';
            }
        }

        async function authenticateWithBiometrics() {
            showAlert(
                'تسجيل الدخول بالبصمة غير مهيأ للتحقق الآمن من الخادم حالياً. استخدم تسجيل الدخول العادي.'
            );
        }

        function showHelpModal() {
            showAlert(
                'للمساعدة في الدخول، يرجى التواصل مع المسؤول عن النظام.'
            );
        }
    </script>
</body>
</html>
